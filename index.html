<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demon Slayer Hinokami Chronicles 2 - Rangliste</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Basis-Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2a 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        /* Hintergrund-Animationen */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .flame {
            position: absolute;
            bottom: -100px;
            background: linear-gradient(to top, rgba(255, 69, 0, 0.8), transparent);
            border-radius: 50% 50% 20% 20%;
            opacity: 0.6;
            animation: rise 15s infinite linear;
        }

        .flame:nth-child(1) {
            width: 40px;
            height: 100px;
            left: 10%;
            animation-duration: 20s;
        }

        .flame:nth-child(2) {
            width: 60px;
            height: 150px;
            left: 30%;
            animation-duration: 15s;
            animation-delay: 2s;
        }

        .flame:nth-child(3) {
            width: 30px;
            height: 80px;
            left: 50%;
            animation-duration: 18s;
            animation-delay: 4s;
        }

        .flame:nth-child(4) {
            width: 70px;
            height: 120px;
            left: 70%;
            animation-duration: 12s;
            animation-delay: 1s;
        }

        .flame:nth-child(5) {
            width: 50px;
            height: 90px;
            left: 90%;
            animation-duration: 17s;
            animation-delay: 3s;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) rotate(20deg);
                opacity: 0;
            }
        }

        /* Header-Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 69, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #ff4500, #ff8c00, #ff4500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
            margin-bottom: 15px;
        }

        h2 {
            font-size: 1.8rem;
            color: #ff8c00;
            margin-bottom: 20px;
            text-shadow: 0 0 5px rgba(255, 140, 0, 0.5);
        }

        /* Login-Bereich */
        .login-area {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-login, .btn-logout {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-login {
            background: linear-gradient(45deg, #4285F4, #34A853);
            color: white;
        }

        .btn-logout {
            background: linear-gradient(45deg, #EA4335, #FBBC05);
            color: white;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 133, 244, 0.4);
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(234, 67, 53, 0.4);
        }

        #userEmail {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Admin-Panel */
        .admin-panel {
            display: none;
            background: rgba(26, 26, 42, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 69, 0, 0.2);
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
        }

        .admin-panel.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #ff8c00;
        }

        .text-input, .select-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 140, 0, 0.3);
            border-radius: 5px;
            background: rgba(10, 10, 26, 0.6);
            color: white;
            transition: all 0.3s ease;
        }

        .text-input:focus, .select-input:focus {
            outline: none;
            border-color: #ff4500;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        .type-buttons {
            display: flex;
            gap: 15px;
        }

        .type-btn {
            padding: 10px 20px;
            border: 1px solid rgba(255, 140, 0, 0.3);
            border-radius: 5px;
            background: rgba(10, 10, 26, 0.6);
            color: #ccc;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .type-btn.selected {
            background: linear-gradient(45deg, #ff4500, #ff8c00);
            color: white;
            border-color: #ff4500;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        .action-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff4500, #ff8c00);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #EA4335, #FF6B6B);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(234, 67, 53, 0.4);
        }

        /* Rangliste */
        .ranking-section {
            margin-top: 30px;
        }

        .ranking-header {
            display: grid;
            grid-template-columns: 80px 1fr 120px 2fr 120px;
            gap: 15px;
            padding: 15px 20px;
            background: rgba(255, 69, 0, 0.2);
            border-radius: 8px 8px 0 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .ranking-list {
            list-style: none;
        }

        .ranking-item {
            display: grid;
            grid-template-columns: 80px 1fr 120px 2fr 120px;
            gap: 15px;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .ranking-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .ranking-item.upper {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
            border-left: 4px solid #ffd700;
        }

        .ranking-item.lower {
            background: linear-gradient(90deg, rgba(192, 192, 192, 0.15), rgba(192, 192, 192, 0.05));
            border-left: 4px solid #c0c0c0;
        }

        .rank-number {
            font-weight: 700;
            font-size: 1.2rem;
            color: #ff8c00;
            display: flex;
            align-items: center;
        }

        .player-name {
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .player-type {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .demon-type {
            background: rgba(255, 69, 0, 0.2);
            color: #ff4500;
        }

        .slayer-type {
            background: rgba(0, 123, 255, 0.2);
            color: #007bff;
        }

        .player-mains {
            display: flex;
            align-items: center;
            color: #ccc;
        }

        .player-rank {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .no-players, .error-message {
            text-align: center;
            padding: 30px;
            font-style: italic;
            color: #888;
        }

        /* Benachrichtigungen */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 5px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            animation: slideInRight 0.3s ease forwards;
            max-width: 350px;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.success {
            background: linear-gradient(45deg, #34A853, #0F9D58);
            box-shadow: 0 5px 15px rgba(52, 168, 83, 0.3);
        }

        .notification.error {
            background: linear-gradient(45deg, #EA4335, #D93025);
            box-shadow: 0 5px 15px rgba(234, 67, 53, 0.3);
        }

        .notification button {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .ranking-header, .ranking-item {
                grid-template-columns: 60px 1fr 100px;
                grid-template-rows: auto auto;
            }
            
            .ranking-header span:nth-child(4),
            .ranking-header span:nth-child(5),
            .ranking-item .player-mains,
            .ranking-item .player-rank {
                display: none;
            }
            
            .ranking-item {
                padding: 12px 15px;
            }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .login-area {
                margin-top: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .ranking-header, .ranking-item {
                grid-template-columns: 50px 1fr;
            }
            
            .ranking-header span:nth-child(3),
            .ranking-item .player-type {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .type-buttons {
                flex-direction: column;
            }
            
            .admin-panel, .ranking-section {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Hintergrund-Animationen -->
    <div class="background-animation">
        <div class="flame"></div>
        <div class="flame"></div>
        <div class="flame"></div>
        <div class="flame"></div>
        <div class="flame"></div>
    </div>

    <div class="container">
        <header>
            <h1><i class="fas fa-fire"></i> Demon Slayer Hinokami Chronicles 2 - Rangliste</h1>
            
            <div class="login-area">
                <button id="loginBtn" class="btn-login"><i class="fab fa-google"></i> Login (Admin)</button>
                <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
                <span id="userEmail"><i class="fas fa-user"></i> Nicht eingeloggt</span>
            </div>
        </header>

        <main>
            <section id="adminPanel" class="admin-panel">
                <h2><i class="fas fa-crown"></i> Spieler verwalten (Admin)</h2>

                <div class="form-group">
                    <label>Spielername:</label>
                    <input type="text" id="playerName" placeholder="Spielername" class="text-input">
                </div>

                <div class="form-group">
                    <label>Typ auswählen:</label>
                    <div class="type-buttons">
                        <button id="btnDemon" class="type-btn selected"><i class="fas fa-moon"></i> Demon</button>
                        <button id="btnDemonSlayer" class="type-btn"><i class="fas fa-shield-alt"></i> Demon Slayer</button>
                    </div>
                </div>

                <div id="mainFields" class="form-group">
                    <label>Main Character 1:</label>
                    <input type="text" id="main1" placeholder="Main 1" class="text-input">
                </div>

                <button id="addUpdateBtn" class="action-btn btn-primary"><i class="fas fa-plus-circle"></i> Spieler hinzufügen/aktualisieren</button>
                
                <div class="form-group">
                    <label>Bestehenden Spieler auswählen:</label>
                    <select id="existingPlayers" class="select-input"></select>
                </div>
                
                <button id="removeBtn" class="action-btn btn-danger"><i class="fas fa-trash-alt"></i> Spieler entfernen</button>
            </section>

            <section class="ranking-section">
                <h2><i class="fas fa-trophy"></i> Live-Rangliste</h2>
                <div class="ranking-header">
                    <span>Rang</span>
                    <span>Name</span>
                    <span>Typ</span>
                    <span>Main Characters</span>
                    <span>Rangstufe</span>
                </div>
                <ul id="rankingList" class="ranking-list"></ul>
            </section>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-analytics.js"></script>

    <script>
    // Firebase Konfiguration
    const firebaseConfig = {
        apiKey: "AIzaSyAHZfys1YpBosbEeK30GG2aVLgG5CpV0DI",
        authDomain: "demonslayerranks.firebaseapp.com",
        databaseURL: "https://demonslayerranks-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "demonslayerranks",
        storageBucket: "demonslayerranks.firebasestorage.app",
        messagingSenderId: "244021550640",
        appId: "1:244021550640:web:4d2a3c7a52c205f5e997f5",
        measurementId: "G-WH3WQBKPX4"
    };
    
    // Admin-Email-Adressen
    const ADMIN_EMAILS = [
        "fabioasik221206@gmail.com",
        "cand7105@gmail.com"
    ];

    // Firebase initialisieren
    const app = firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();
    const analytics = firebase.analytics();

    // Google Auth Provider
    const provider = new firebase.auth.GoogleAuthProvider();

    // DOM Elemente
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const adminPanel = document.getElementById("adminPanel");
    const rankingList = document.getElementById("rankingList");
    const existingPlayers = document.getElementById("existingPlayers");
    const btnDemon = document.getElementById("btnDemon");
    const btnDemonSlayer = document.getElementById("btnDemonSlayer");
    const mainFields = document.getElementById("mainFields");
    const addUpdateBtn = document.getElementById("addUpdateBtn");
    const removeBtn = document.getElementById("removeBtn");

    let selectedType = "Demon";
    let currentUser = null;

    // Event-Listener
    loginBtn.addEventListener("click", signInWithGoogle);
    logoutBtn.addEventListener("click", signOut);
    
    // Typ Buttons
    btnDemon.addEventListener("click", ()=>{
        selectedType = "Demon";
        btnDemon.classList.add("selected");
        btnDemonSlayer.classList.remove("selected");
        mainFields.innerHTML = `<label>Main Character 1:</label><input type="text" id="main1" placeholder="Main 1" class="text-input">`;
    });
    
    btnDemonSlayer.addEventListener("click", ()=>{
        selectedType = "Demon Slayer";
        btnDemonSlayer.classList.add("selected");
        btnDemon.classList.remove("selected");
        mainFields.innerHTML = `<label>Main Character 1:</label><input type="text" id="main1" placeholder="Main 1" class="text-input">
        <label>Main Character 2:</label><input type="text" id="main2" placeholder="Main 2" class="text-input">`;
    });

    // Spieler hinzufügen/aktualisieren
    addUpdateBtn.addEventListener("click", addOrUpdatePlayer);
    
    // Spieler entfernen
    removeBtn.addEventListener("click", removePlayer);

    // Mit Google anmelden
    function signInWithGoogle() {
        auth.signInWithPopup(provider)
            .then((result) => {
                console.log("Erfolgreich angemeldet:", result.user);
                showNotification("Erfolgreich angemeldet", "success");
            })
            .catch((error) => {
                console.error("Fehler bei der Anmeldung:", error);
                showNotification("Anmeldung fehlgeschlagen: " + error.message, "error");
            });
    }

    // Abmelden
    function signOut() {
        auth.signOut()
            .then(() => {
                console.log("Erfolgreich abgemeldet");
                showNotification("Erfolgreich abgemeldet", "success");
            })
            .catch((error) => {
                console.error("Fehler beim Abmelden:", error);
            });
    }

    // Auth State ändert sich
    auth.onAuthStateChanged((user) => {
        currentUser = user;
        if (user) {
            document.getElementById("userEmail").innerHTML = `<i class="fas fa-user"></i> ${user.email}`;
            
            // Admin-Rechte prüfen
            if (ADMIN_EMAILS.includes(user.email)) {
                adminPanel.style.display = "block";
                setTimeout(() => {
                    adminPanel.classList.add("visible");
                }, 10);
            } else {
                adminPanel.style.display = "none";
            }
        } else {
            adminPanel.style.display = "none";
            document.getElementById("userEmail").innerHTML = "<i class=\"fas fa-user\"></i> Nicht eingeloggt";
        }
        
        // Spieler laden
        loadPlayers();
    });

    // Spieler hinzufügen oder aktualisieren
    function addOrUpdatePlayer() {
        if (!currentUser) {
            showNotification("Bitte zuerst anmelden", "error");
            return;
        }
        
        // Admin-Rechte prüfen
        if (!ADMIN_EMAILS.includes(currentUser.email)) {
            showNotification("Nur Administratoren können Spieler hinzufügen", "error");
            return;
        }
        
        const name = document.getElementById("playerName").value.trim();
        const main1 = document.getElementById("main1").value.trim();
        let main2 = "";
        
        if (selectedType === "Demon Slayer") {
            main2 = document.getElementById("main2").value.trim();
        }

        if (!name || !main1 || (selectedType === "Demon Slayer" && !main2)) {
            showNotification("Bitte alle Felder ausfüllen!", "error");
            return;
        }

        const mains = selectedType === "Demon" ? [main1] : [main1, main2];
        const playerData = {
            name: name,
            type: selectedType,
            mains: mains,
            rank: "Lower Moon 6"
        };

        // Spieler zur Datenbank hinzufügen
        database.ref('players/' + name).set(playerData)
            .then(() => {
                showNotification("Spieler erfolgreich hinzugefügt/aktualisiert!", "success");
                // Formular zurücksetzen
                document.getElementById("playerName").value = "";
                document.getElementById("main1").value = "";
                if (main2) document.getElementById("main2").value = "";
            })
            .catch((error) => {
                console.error("Fehler beim Speichern des Spielers:", error);
                showNotification("Fehler beim Speichern: " + error.message, "error");
            });
    }

    // Spieler entfernen
    function removePlayer() {
        if (!currentUser) {
            showNotification("Bitte zuerst anmelden", "error");
            return;
        }
        
        // Admin-Rechte prüfen
        if (!ADMIN_EMAILS.includes(currentUser.email)) {
            showNotification("Nur Administratoren können Spieler entfernen", "error");
            return;
        }
        
        const name = existingPlayers.value;
        if (!name) {
            showNotification("Bitte einen Spieler auswählen", "error");
            return;
        }
        
        if (!confirm(`Möchten Sie wirklich "${name}" entfernen?`)) {
            return;
        }
        
        // Spieler aus der Datenbank entfernen
        database.ref('players/' + name).remove()
            .then(() => {
                showNotification("Spieler erfolgreich entfernt!", "success");
            })
            .catch((error) => {
                console.error("Fehler beim Entfernen des Spielers:", error);
                showNotification("Fehler beim Entfernen: " + error.message, "error");
            });
    }

    // Spieler aus der Datenbank laden
    function loadPlayers() {
        database.ref('players').once('value')
            .then((snapshot) => {
                const players = [];
                snapshot.forEach((childSnapshot) => {
                    players.push(childSnapshot.val());
                });
                
                updateDropdown(players);
                renderRanking(players);
            })
            .catch((error) => {
                console.error("Fehler beim Laden der Spieler:", error);
                rankingList.innerHTML = `<li class="error-message">Fehler beim Laden: ${error.message}</li>`;
                
                if (error.code === 'PERMISSION_DENIED') {
                    showNotification("Berechtigungsfehler: Überprüfen Sie die Firebase-Regeln", "error");
                }
            });
    }

    // Echtzeit-Updates der Rangliste
    function setupRealtimeUpdates() {
        database.ref('players').on('value', (snapshot) => {
            const players = [];
            snapshot.forEach((childSnapshot) => {
                players.push(childSnapshot.val());
            });
            
            updateDropdown(players);
            renderRanking(players);
        }, (error) => {
            console.error("Fehler bei Echtzeit-Updates:", error);
        });
    }

    // Dropdown für Admin aktualisieren
    function updateDropdown(players) {
        existingPlayers.innerHTML = "";
        players.forEach(player => {
            const option = document.createElement("option");
            option.value = player.name;
            option.textContent = player.name;
            existingPlayers.appendChild(option);
        });
    }
   

    // Rangliste rendern
    function renderRanking(players) {
        rankingList.innerHTML = "";
        
        if (players.length === 0) {
            rankingList.innerHTML = "<li class='no-players'>Keine Spieler vorhanden</li>";
            return;
        }
        
        const rankOrder = {
            "Upper Moon 1": 1,
            "Upper Moon 2": 2,
            "Upper Moon 3": 3,
            "Upper Moon 4": 4,
            "Upper Moon 5": 5,
            "Upper Moon 6": 6,
            "Lower Moon 1": 7,
            "Lower Moon 2": 8,
            "Lower Moon 3": 9,
            "Lower Moon 4": 10,
            "Lower Moon 5": 11,
            "Lower Moon 6": 12
        };
        
        // Spieler nach Rang sortieren
        const sortedPlayers = players.sort((a, b) => {
            return (rankOrder[a.rank] || 12) - (rankOrder[b.rank] || 12);
        });

        // Rangliste rendern
        sortedPlayers.forEach((player, index) => {
            const li = document.createElement("li");
            li.className = `ranking-item ${player.rank.startsWith("Upper") ? "upper" : "lower"}`;
            
            li.innerHTML = `
                <span class="rank-number">${index + 1}</span>
                <span class="player-name">${player.name}</span>
                <span class="player-type ${player.type === 'Demon' ? 'demon-type' : 'slayer-type'}">${player.type}</span>
                <span class="player-mains">${player.mains.join(", ")}</span>
                <span class="player-rank">${player.rank}</span>
            `;
            
            rankingList.appendChild(li);
        });
    }

    // Benachrichtigung anzeigen
    function showNotification(message, type) {
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.innerHTML = `
            <span>${message}</span>
            <button onclick="this.parentElement.remove()">&times;</button>
        `;
        
        document.body.appendChild(notification);
        
        // Automatisch nach 3 Sekunden entfernen
        setTimeout(() => {
            if (notification.parentElement) {
                notification.remove();
            }
        }, 3000);
    }

    // Echtzeit-Updates einrichten
    setupRealtimeUpdates();

    // Initial Spieler laden
    loadPlayers();
    </script>
</body>
</html>
