<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demon Slayer Ranks</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Grundstyles */
    body { font-family: Arial, sans-serif; background-color: #111; color: #eee; margin: 0; padding: 0;}
    .container { max-width: 900px; margin: auto; padding: 20px;}
    h2 { text-align: center; margin-bottom: 20px; }

    /* Rangliste */
    .rank-section { margin-bottom: 20px; opacity: 0; transform: translateY(20px); transition: all 0.5s ease; }
    .rank-section.show { opacity: 1; transform: translateY(0); }
    .rank-section h3 { margin-bottom: 10px; color: #ffcc00; }
    .rank-section ul { list-style: none; padding: 0; }

    /* Mains */
    .main-demon { color: red; font-weight: bold; transition: all 0.3s ease; }
    .main-demon-slayer { color: blue; font-weight: bold; transition: all 0.3s ease; }
    li:hover { transform: scale(1.05); transition: all 0.2s ease; cursor: pointer; }

    /* Buttons & Inputs */
    .btn { padding: 8px 16px; margin: 5px; border: none; cursor: pointer; border-radius: 5px; }
    .btn-primary { background-color: #ff6600; color: white; }
    .btn-outline { background-color: transparent; color: white; border: 1px solid white; }
    input[type="text"] { padding: 8px; width: 100%; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 10px; }

    /* Admin Panel */
    #adminPanel { margin-top: 20px; }
    #mainInputContainer { margin-top: 10px; display: none; }

  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-container">
      <div class="logo">Demon Slayer Ranks</div>
      <nav class="nav">
        <a href="#ranks">Rangliste</a>
        <a href="#admin" id="adminNavLink" style="display:none;">Admin</a>
        <button id="loginBtn" class="btn btn-primary">Login</button>
        <button id="logoutBtn" class="btn btn-outline" style="display:none;">Logout</button>
      </nav>
    </div>
  </header>

  <!-- Nickname Eingabe -->
  <section id="nicknameSection" class="section" style="display:none;">
    <div class="container">
      <h2>Wähle einen Nickname</h2>
      <input type="text" id="nicknameInput" placeholder="Dein Nickname" />
      <button id="saveNicknameBtn" class="btn btn-primary">Speichern</button>
    </div>
  </section>

  <!-- Rangliste -->
  <section id="ranks" class="section">
    <div class="container">
      <h2>Rangliste</h2>
      <div id="rankList" class="rank-list"></div>
    </div>
  </section>

  <!-- Admin Panel -->
  <section id="admin" class="section">
    <div class="container">
      <div id="adminPanel" style="display:none;">
        <h2>Admin Panel</h2>
        <form id="playerForm">
          <input type="text" id="playerNameInput" placeholder="Nickname des Spielers eingeben" />

          <select id="playerRank">
            <option value="Lower Moon 6">Lower Moon 6</option>
            <option value="Lower Moon 5">Lower Moon 5</option>
            <option value="Lower Moon 4">Lower Moon 4</option>
            <option value="Lower Moon 3">Lower Moon 3</option>
            <option value="Lower Moon 2">Lower Moon 2</option>
            <option value="Lower Moon 1">Lower Moon 1</option>
            <option value="Upper Moon 6">Upper Moon 6</option>
            <option value="Upper Moon 5">Upper Moon 5</option>
            <option value="Upper Moon 4">Upper Moon 4</option>
            <option value="Upper Moon 3">Upper Moon 3</option>
            <option value="Upper Moon 2">Upper Moon 2</option>
            <option value="Upper Moon 1">Upper Moon 1</option>
          </select>

          <div style="margin-top:10px;">
            <button type="button" id="demonBtn">Demon</button>
            <button type="button" id="demonSlayerBtn">Demon Slayer</button>
          </div>

          <div id="mainInputContainer">
            <input type="text" id="playerMainInput" placeholder="Trage hier die Main(s) ein" />
          </div>

          <button type="submit" class="btn btn-primary">Spieler aktualisieren</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      &copy; Abonniert mich lol – J.O.K.R auf Youtube!
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHZfys1YpBosbEeK30GG2aVLgG5CpV0DI",
      authDomain: "demonslayerranks.firebaseapp.com",
      databaseURL: "https://demonslayerranks-default-rtdb.europe-west1.firebasedatabase.app/",
      projectId: "demonslayerranks",
      storageBucket: "demonslayerranks.firebasedatabase.app",
      messagingSenderId: "244021550640",
      appId: "1:244021550640:web:4d2a3c7a52c205f5e997f5",
      measurementId: "G-WH3WQBKPX4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getDatabase(app);

    const ADMINS = ["fabioasik221206@gmail.com", "cand7105@gmail.com"];

    document.addEventListener("DOMContentLoaded", () => {
      const loginBtn = document.getElementById("loginBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const adminPanel = document.getElementById("adminPanel");
      const rankListEl = document.getElementById("rankList");

      const playerForm = document.getElementById("playerForm");
      const playerNameInput = document.getElementById("playerNameInput");
      const playerRankSelect = document.getElementById("playerRank");
      const mainInputContainer = document.getElementById("mainInputContainer");
      const playerMainInput = document.getElementById("playerMainInput");

      const demonBtn = document.getElementById("demonBtn");
      const demonSlayerBtn = document.getElementById("demonSlayerBtn");

      const nicknameSection = document.getElementById("nicknameSection");
      const nicknameInput = document.getElementById("nicknameInput");
      const saveNicknameBtn = document.getElementById("saveNicknameBtn");

      let mainType = "";
      let currentUser = null;
      let allPlayers = [];

      const playersRef = ref(db, "players");

      loginBtn.addEventListener("click", () => signInWithPopup(auth, provider).catch(console.error));
      logoutBtn.addEventListener("click", () => signOut(auth).catch(console.error));

      onAuthStateChanged(auth, user => {
        currentUser = user;
        if (user) {
          loginBtn.style.display = "none";
          logoutBtn.style.display = "inline-block";

          const userRef = ref(db, `players/${user.uid}`);
          onValue(userRef, snapshot => {
            if (!snapshot.exists()) {
              set(userRef, { nickname: "", rank: "", mainType: "", mains: [] });
              nicknameSection.style.display = "block";
            } else if (!snapshot.val().nickname) {
              nicknameSection.style.display = "block";
            } else {
              nicknameSection.style.display = "none";
            }
          });

          adminPanel.style.display = ADMINS.includes(user.email) ? "block" : "none";
          document.getElementById("adminNavLink").style.display = ADMINS.includes(user.email) ? "inline-block" : "none";

        } else {
          loginBtn.style.display = "inline-block";
          logoutBtn.style.display = "none";
          adminPanel.style.display = "none";
          document.getElementById("adminNavLink").style.display = "none";
          nicknameSection.style.display = "none";
        }
      });

      saveNicknameBtn.addEventListener("click", () => {
        const nickname = nicknameInput.value.trim();
        if (!nickname || !currentUser) return alert("Bitte einen gültigen Nickname eingeben.");
        update(ref(db, `players/${currentUser.uid}`), { nickname });
        nicknameSection.style.display = "none";
      });

      onValue(playersRef, snapshot => {
        const data = snapshot.val() || {};
        allPlayers = Object.keys(data).map(id => ({
          id,
          nickname: data[id].nickname || `Spieler-${id.substring(0,5)}`,
          rank: data[id].rank || "",
          mainType: data[id].mainType || "",
          mains: Array.isArray(data[id].mains) ? data[id].mains : []
        }));

        renderRankList();
      });

      function renderRankList() {
        rankListEl.innerHTML = "";
        const rankOrder = [
          "Upper Moon 1","Upper Moon 2","Upper Moon 3","Upper Moon 4","Upper Moon 5","Upper Moon 6",
          "Lower Moon 1","Lower Moon 2","Lower Moon 3","Lower Moon 4","Lower Moon 5","Lower Moon 6"
        ];
        const sorted = [...allPlayers].sort((a,b) => {
          const aIndex = rankOrder.indexOf(a.rank) === -1 ? 999 : rankOrder.indexOf(a.rank);
          const bIndex = rankOrder.indexOf(b.rank) === -1 ? 999 : rankOrder.indexOf(b.rank);
          return aIndex - bIndex;
        });

        const groups = {};
        sorted.forEach(p => {
          if (!groups[p.rank]) groups[p.rank] = [];
          const mainsText = p.mains.map(m => {
            if(p.mainType === "Demon") return `<span class="main-demon">🔥 ${m}</span>`;
            if(p.mainType === "Demon Slayer") return `<span class="main-demon-slayer">⚔️ ${m}</span>`;
            return m;
          }).join(", ");
          const displayText = mainsText ? `${p.nickname} (${mainsText})` : p.nickname;
          groups[p.rank].push(displayText);
        });

        Object.keys(groups).forEach(rank => {
          const section = document.createElement("div");
          section.className = "rank-section";
          section.innerHTML = `<h3>${rank}</h3><ul>${groups[rank].map(name=>`<li>${name}</li>`).join("")}</ul>`;
          rankListEl.appendChild(section);
          setTimeout(()=>section.classList.add("show"), 50); // Animation
        });
      }

      demonBtn.addEventListener("click", () => { mainType="Demon"; mainInputContainer.style.display="block"; playerMainInput.placeholder="1 Main eingeben"; playerMainInput.value=""; });
      demonSlayerBtn.addEventListener("click", () => { mainType="Demon Slayer"; mainInputContainer.style.display="block"; playerMainInput.placeholder="2 Mains eingeben, getrennt durch Komma"; playerMainInput.value=""; });

      playerForm.addEventListener("submit", e => {
        e.preventDefault();
        const nicknameInputValue = playerNameInput.value.trim();
        if (!nicknameInputValue || !mainType || !playerMainInput.value.trim() || !playerRankSelect.value) return alert("Bitte alle Felder ausfüllen!");

        const player = allPlayers.find(p => p.nickname.toLowerCase() === nicknameInputValue.toLowerCase());
        if (!player) return alert("Spieler nicht gefunden!");

        let mains = playerMainInput.value.split(",").map(m => m.trim());
        if(mainType==="Demon" && mains.length!==1) return alert("Demon darf nur 1 Main haben!");
        if(mainType==="Demon Slayer" && mains.length!==2) return alert("Demon Slayer muss genau 2 Mains haben!");

        update(ref(db, `players/${player.id}`), { rank: playerRankSelect.value, mainType, mains })
          .then(()=>{ mainInputContainer.style.display="none"; playerMainInput.value=""; mainType=""; });
      });

    });
  </script>
</body>
</html>
