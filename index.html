<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demon Slayer Ranks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-container">
      <div class="logo">Demon Slayer Ranks</div>
      <nav class="nav">
        <a href="#ranks">Rangliste</a>
        <a href="#admin" id="adminNavLink" style="display:none;">Admin</a>
        <button id="loginBtn" class="btn btn-primary">Login</button>
        <button id="logoutBtn" class="btn btn-outline" style="display:none;">Logout</button>
      </nav>
    </div>
  </header>

  <!-- Rangliste -->
  <section id="ranks" class="section">
    <div class="container">
      <h2>Rangliste</h2>
      <div id="rankList" class="rank-list"></div>
    </div>
  </section>

  <!-- Admin Panel -->
  <section id="admin" class="section">
    <div class="container">
      <div id="adminPanel" style="display:none;">
        <h2>Admin Panel</h2>
        <form id="playerForm">
          <!-- Spieler auswählen -->
          <select id="playerSelect">
            <option value="" disabled selected>Spieler auswählen</option>
          </select>

          <!-- Rang auswählen -->
          <select id="playerRank">
            <option value="Lower Moon 6">Lower Moon 6</option>
            <option value="Lower Moon 5">Lower Moon 5</option>
            <option value="Lower Moon 4">Lower Moon 4</option>
            <option value="Lower Moon 3">Lower Moon 3</option>
            <option value="Lower Moon 2">Lower Moon 2</option>
            <option value="Lower Moon 1">Lower Moon 1</option>
            <option value="Upper Moon 6">Upper Moon 6</option>
            <option value="Upper Moon 5">Upper Moon 5</option>
            <option value="Upper Moon 4">Upper Moon 4</option>
            <option value="Upper Moon 3">Upper Moon 3</option>
            <option value="Upper Moon 2">Upper Moon 2</option>
            <option value="Upper Moon 1">Upper Moon 1</option>
          </select>

          <!-- Main auswählen -->
          <select id="playerMain">
            <option value="" disabled selected>Main auswählen</option>
            <option value="2 Demon Slayer">2 Demon Slayer</option>
            <option value="1 Demon">1 Demon</option>
          </select>

          <button type="submit" class="btn btn-primary">Spieler aktualisieren</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      &copy; Abonniert mich lol – J.O.K.R auf Youtube
    </div>
  </footer>

  <!-- Firebase & Admin Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHZfys1YpBosbEeK30GG2aVLgG5CpV0DI",
      authDomain: "demonslayerranks.firebaseapp.com",
      databaseURL: "https://demonslayerranks-default-rtdb.europe-west1.firebasedatabase.app/",
      projectId: "demonslayerranks",
      storageBucket: "demonslayerranks.firebasestorage.app",
      messagingSenderId: "244021550640",
      appId: "1:244021550640:web:4d2a3c7a52c205f5e997f5",
      measurementId: "G-WH3WQBKPX4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getDatabase(app);

    const ADMINS = ["fabioasik221206@gmail.com", "redgamepvp474@gmail.com"];

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const adminPanel = document.getElementById("adminPanel");
    const rankListEl = document.getElementById("rankList");

    const playerForm = document.getElementById("playerForm");
    const playerSelect = document.getElementById("playerSelect");
    const playerRankSelect = document.getElementById("playerRank");
    const playerMainSelect = document.getElementById("playerMain");

    const playersRef = ref(db, "players");

    // Login / Logout
    loginBtn.addEventListener("click", () => {
      signInWithPopup(auth, provider)
        .catch(err => console.error("Login-Fehler:", err));
    });

    logoutBtn.addEventListener("click", () => {
      signOut(auth).catch(err => console.error("Logout-Fehler:", err));
    });

    // Auth-Zustand
    onAuthStateChanged(auth, user => {
      if (user) {
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";

        if (ADMINS.includes(user.email)) {
          adminPanel.style.display = "block";
          document.getElementById("adminNavLink").style.display = "inline-block";
        } else {
          adminPanel.style.display = "none";
          document.getElementById("adminNavLink").style.display = "none";
        }
      } else {
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        adminPanel.style.display = "none";
        document.getElementById("adminNavLink").style.display = "none";
      }
    });

    // Spieler aus DB laden
    onValue(playersRef, snapshot => {
      const data = snapshot.val() || {};
      const players = Object.keys(data).map(id => ({
        id,
        name: data[id].name,
        rank: data[id].rank,
        main: data[id].main || ""
      }));

      // Dropdown aktualisieren
      playerSelect.innerHTML = '<option value="" disabled selected>Spieler auswählen</option>';
      players.forEach(p => {
        const option = document.createElement("option");
        option.value = p.id;
        option.textContent = p.name;
        playerSelect.appendChild(option);
      });

      // Rangliste rendern
      renderRanks(players);
    });

    // Spieler aktualisieren
    playerForm.addEventListener("submit", e => {
      e.preventDefault();
      const playerId = playerSelect.value;
      const rank = playerRankSelect.value;
      const main = playerMainSelect.value;

      if (playerId && rank && main) {
        const playerRef = ref(db, `players/${playerId}`);
        update(playerRef, { rank, main })
          .then(() => console.log("Spieler aktualisiert"))
          .catch(err => console.error("Fehler beim Aktualisieren:", err));
      }
    });

    // Rangliste rendern
    function renderRanks(players) {
      rankListEl.innerHTML = "";
      const groups = {};
      players.forEach(p => {
        if (!groups[p.rank]) groups[p.rank] = [];
        groups[p.rank].push(`${p.name} (${p.main})`);
      });

      Object.keys(groups).forEach(rank => {
        const section = document.createElement("div");
        section.className = "rank-section";
        section.innerHTML = `
          <h3>${rank}</h3>
          <ul>
            ${groups[rank].map(name => `<li>${name}</li>`).join("")}
          </ul>
        `;
        rankListEl.appendChild(section);
      });
    }
  </script>
</body>
</html>
