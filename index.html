<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demon Slayer Ranks</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module">
    // Firebase Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // Deine Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAHZfys1YpBosbEeK30GG2aVLgG5CpV0DI",
      authDomain: "demonslayerranks.firebaseapp.com",
      databaseURL: "https://demonslayerranks-default-rtdb.europe-west1.firebasedatabase.app/",
      projectId: "demonslayerranks",
      storageBucket: "demonslayerranks.firebasestorage.app",
      messagingSenderId: "244021550640",
      appId: "1:244021550640:web:4d2a3c7a52c205f5e997f5",
      measurementId: "G-WH3WQBKPX4"
    };

    // Init Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getDatabase(app);

    // Admin-Liste (hier Emails eintragen)
    const ADMINS = ["fabioasik221206@gmail.com", "redgamepvp474@gmail.com"];

    // Elemente
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const adminPanel = document.getElementById("adminPanel");
    const rankListEl = document.getElementById("rankList");
    const playerForm = document.getElementById("playerForm");
    const playerNameInput = document.getElementById("playerName");
    const playerRankSelect = document.getElementById("playerRank");

    // Login
    loginBtn.addEventListener("click", () => {
      signInWithPopup(auth, provider);
    });

    // Logout
    logoutBtn.addEventListener("click", () => {
      signOut(auth);
    });

    // Auth-Zustand
    onAuthStateChanged(auth, user => {
      if (user) {
        const email = user.email;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";

        if (ADMINS.includes(email)) {
          adminPanel.style.display = "block";
        } else {
          adminPanel.style.display = "none";
        }
      } else {
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        adminPanel.style.display = "none";
      }
    });

    // Spieler anzeigen (dynamisch, nur belegte Ränge)
    function renderRanks(players) {
      rankListEl.innerHTML = "";

      // Gruppieren
      const groups = {};
      players.forEach(p => {
        if (!groups[p.rank]) groups[p.rank] = [];
        groups[p.rank].push(p.name);
      });

      // Rendern nur wenn Spieler vorhanden
      Object.keys(groups).forEach(rank => {
        const section = document.createElement("div");
        section.className = "rank-section";
        section.innerHTML = `
          <h3>${rank}</h3>
          <ul>
            ${groups[rank].map(name => `<li>${name}</li>`).join("")}
          </ul>
        `;
        rankListEl.appendChild(section);
      });
    }

    // Spieler aus DB laden
    const playersRef = ref(db, "players");
    onValue(playersRef, snapshot => {
      const data = snapshot.val() || {};
      const players = Object.keys(data).map(id => ({
        id,
        name: data[id].name,
        rank: data[id].rank
      }));
      renderRanks(players);
    });

    // Spieler hinzufügen
    playerForm.addEventListener("submit", e => {
      e.preventDefault();
      const name = playerNameInput.value.trim();
      const rank = playerRankSelect.value;

      if (name && rank) {
        push(playersRef, { name, rank });
        playerNameInput.value = "";
      }
    });
  </script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-container">
      <div class="logo">Demon Slayer Ranks</div>
      <nav class="nav">
        <a href="#ranks">Rangliste</a>
        <a href="#admin" id="adminNavLink" style="display:none;">Admin</a>
        <button id="loginBtn" class="btn btn-primary">Login</button>
        <button id="logoutBtn" class="btn btn-outline" style="display:none;">Logout</button>
      </nav>
    </div>
  </header>

  <!-- Rangliste -->
  <section id="ranks" class="section">
    <div class="container">
      <h2>Rangliste</h2>
      <div id="rankList" class="rank-list"></div>
    </div>
  </section>

  <!-- Admin Panel -->
  <section id="admin" class="section">
    <div class="container">
      <div id="adminPanel" style="display:none;">
        <h2>Admin Panel</h2>
        <form id="playerForm">
          <input type="text" id="playerName" placeholder="Spielername" required />
          <select id="playerRank">
            <option value="Lower Moon 6">Lower Moon 6</option>
            <option value="Lower Moon 5">Lower Moon 5</option>
            <option value="Lower Moon 4">Lower Moon 4</option>
            <option value="Lower Moon 3">Lower Moon 3</option>
            <option value="Lower Moon 2">Lower Moon 2</option>
            <option value="Lower Moon 1">Lower Moon 1</option>
            <option value="Upper Moon 6">Upper Moon 6</option>
            <option value="Upper Moon 5">Upper Moon 5</option>
            <option value="Upper Moon 4">Upper Moon 4</option>
            <option value="Upper Moon 3">Upper Moon 3</option>
            <option value="Upper Moon 2">Upper Moon 2</option>
            <option value="Upper Moon 1">Upper Moon 1</option>
          </select>
          <button type="submit" class="btn btn-primary">Spieler hinzufügen</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      &copy; Abonniert mich lol – J.O.K.R auf Youtube
    </div>
  </footer>
</body>
</html>
